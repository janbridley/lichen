name: Lichen
options:
  bundleIdPrefix: com.janbridley
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Most boilerplate is compiled directly from the AppexSaverMinimal submodule by
# path (verbatim). Lichen owns only its overrides under Sources/Lichen and Resources/
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_LANGUAGE: en
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ALWAYS_SEARCH_USER_PATHS: NO

packages:
  PaperSaver:
    url: https://github.com/AerialScreensaver/PaperSaver.git
    exactVersion: 0.2.0

targets:
  Lichen:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.janbridley.lichen
        PRODUCT_NAME: Lichen
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AppexSaverMinimal/AppexSaverMinimal/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppexSaverMinimal/AppexSaverMinimal/AppexSaverMinimal.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    sources:
      # submodule-verbatim
      - path: AppexSaverMinimal/AppexSaverMinimal/AppexSaverMinimalApp.swift
      - path: AppexSaverMinimal/AppexSaverMinimal/PreviewViewRepresentable.swift
      # lichen-owned overrides
      - path: Sources/Lichen/Host/ContentView.swift
      - path: Sources/Lichen/Host/PluginManager.swift
      - path: Sources/Lichen/Host/PreviewView.swift
      # lichen-owned shared (also in the extension target)
      - path: Sources/Lichen/LichenAnimator.swift
      - path: Sources/Lichen/Shared/Logger.swift
    dependencies:
      - package: PaperSaver
        product: PaperSaverKit
      - target: LichenExtension
        embed: true

  LichenExtension:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.janbridley.lichen.Extension
        PRODUCT_NAME: LichenExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Lichen.appex/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppexSaverMinimal/AppexSaverMinimalExtension/AppexSaverMinimalExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AppexSaverMinimal/AppexSaverMinimalExtension/AppexSaverMinimalExtension-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    sources:
      # submodule-verbatim
      - path: AppexSaverMinimal/AppexSaverMinimalExtension/AppexSaverMinimalExtension.swift
      - path: AppexSaverMinimal/AppexSaverMinimalExtension/AppexSaverMinimalViewController.swift
      - path: AppexSaverMinimal/AppexSaverMinimalExtension/AppexSaverMinimalConfigurationViewController.swift
      - path: AppexSaverMinimal/AppexSaverMinimalExtension/AppexSaverMinimalExtension-Bridging-Header.h
      - path: AppexSaverMinimal/AppexSaverMinimalExtension/PrivateHeaders/ScreenSaverPrivate.h
      - path: AppexSaverMinimal/AppexSaverMinimalExtension/Assets.xcassets
      # lichen-owned overrides
      - path: Sources/Lichen/Host/AppexSaverMinimalView.swift
      # lichen-owned shared (also in the app target)
      - path: Sources/Lichen/LichenAnimator.swift
      - path: Sources/Lichen/Shared/Logger.swift
    dependencies:
      - sdk: ScreenSaver.framework
